<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="fourCss.css">
  <title>Number guessing game</title>
</head>
<body style="background-color: #212121; color: #fff;">
  <nav>
    <a href="/" aria-current="page">Home </a>
    <a href="http://www.youtube.com/@chaiaurcode" target="_blank">Youtube Channel</a>

  </nav>

  <div id="wrapper">
    <h1>Number Guessing game </h1>
    <p>Try and guess a random number between 1 and 100</p>
    <p>you have 10 attempts to guess the right number</p>
  </br>

  <form class="form">
    <label for="guessField" id="guess">Guess a number</label>
    <input type="text" id="guessField" class="guessField">
    <input type="submit" id="subt" value="Submit guess" class="quessSubmit">
  </form>

  <div class="resultParas">
    <p>previous Guesses : <span class="guesses"> </span></p>
    <p>Guesses Remaiing : <span class="lastResult">10</span></p>
    <p class="lowOrHi"></p>
  </div>

  </div>

  <script src="fourJs.js"></script>
  
</body>
</html>
